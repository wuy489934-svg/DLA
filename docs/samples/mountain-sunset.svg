<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a49"/>
      <stop offset="45%" stop-color="#7a4b6b"/>
      <stop offset="75%" stop-color="#e08b5a"/>
      <stop offset="100%" stop-color="#f6c56b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b46a"/>
      <stop offset="55%" stop-color="#4a5a7a"/>
      <stop offset="100%" stop-color="#1b2338"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b4568"/>
      <stop offset="100%" stop-color="#8a6076"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe6a3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="330" fill="url(#sky)"/>

  <!-- 太阳光晕与太阳 -->
  <circle cx="560" cy="290" r="150" fill="url(#glow)"/>
  <circle cx="560" cy="290" r="58" fill="#ffe9b0"/>
  <circle cx="560" cy="290" r="58" fill="#fff6d8" opacity="0.55"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="180" cy="120" rx="110" ry="16"/>
    <ellipse cx="300" cy="160" rx="80" ry="12"/>
    <ellipse cx="640" cy="110" rx="90" ry="13"/>
  </g>

  <!-- 远山 -->
  <path d="M0 330 L120 230 L210 300 L300 195 L400 300 L470 250 L560 330 Z" fill="url(#far)" opacity="0.85"/>
  <!-- 近山 -->
  <path d="M0 335 L90 270 L170 320 L260 250 L360 335 Z" fill="#33293f"/>
  <path d="M430 335 L540 240 L630 310 L720 255 L800 330 L800 335 Z" fill="#2b2236"/>

  <!-- 湖面 -->
  <rect x="0" y="330" width="800" height="170" fill="url(#lake)"/>

  <!-- 水面倒影 -->
  <g fill="#ffe9b0" opacity="0.45">
    <rect x="530" y="338" width="60" height="4" rx="2"/>
    <rect x="520" y="352" width="80" height="4" rx="2"/>
    <rect x="535" y="366" width="50" height="3" rx="1.5"/>
    <rect x="545" y="380" width="30" height="3" rx="1.5"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <line x1="60" y1="360" x2="300" y2="360"/>
    <line x1="140" y1="395" x2="420" y2="395"/>
    <line x1="380" y1="430" x2="700" y2="430"/>
    <line x1="80" y1="465" x2="360" y2="465"/>
  </g>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#2b2236" stroke-width="3" stroke-linecap="round">
    <path d="M150 160 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M210 130 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M255 178 q7 -7 14 0 q7 -7 14 0"/>
  </g>
</svg>
