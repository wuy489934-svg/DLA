<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nomi — Geometric Helper</title>
  <desc id="desc">A friendly modular helper robot made from rounded squares, with a warm on-device power core and simple swappable expressions.</desc>
  <metadata>DLA mascot concept v3 / Nomi. Palette: ink #0A1312, mint #7FE7C4, mint shade #4FC9A8, dark mint #2C8B73, deep teal #12332C, pale light #D5FFF2, warm apricot #FFC48A. Built on a 1024 px grid. Geometry uses circles, capsules and rounded rectangles only. Face and chest are separate groups for expression variants and status pulses. No gradients, fonts, external images or effects.</metadata>
  <!-- antenna: a simple local status light -->
  <g id="antenna">
    <path d="M512 178 C522 142 538 118 554 106" fill="none" stroke="#4FC9A8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="557" cy="102" r="25" fill="#FFC48A"/>
  </g>
  <!-- ear pods: the headset silhouette keeps the robot readable at 24 dp -->
  <g id="ears">
    <rect x="250" y="330" width="76" height="126" rx="38" fill="#4FC9A8"/>
    <rect x="698" y="330" width="76" height="126" rx="38" fill="#4FC9A8"/>
    <rect x="264" y="350" width="48" height="86" rx="24" fill="#2C8B73"/>
    <rect x="712" y="350" width="48" height="86" rx="24" fill="#2C8B73"/>
  </g>
  <!-- one arm relaxed, one arm raised: ready to help, never stiff -->
  <g id="arms">
    <rect x="230" y="714" width="82" height="82" rx="24" fill="#4FC9A8"/>
    <rect x="246" y="730" width="20" height="20" rx="7" fill="#9DF1D8" opacity=".65"/>
    <rect x="738" y="508" width="82" height="82" rx="24" fill="#4FC9A8"/>
    <rect x="754" y="524" width="20" height="20" rx="7" fill="#9DF1D8" opacity=".65"/>
    <path d="M356 664 C312 684 286 720 276 754" fill="none" stroke="#4FC9A8" stroke-width="56" stroke-linecap="round"/>
    <path d="M668 664 C716 652 748 614 764 574" fill="none" stroke="#4FC9A8" stroke-width="56" stroke-linecap="round"/>
  </g>
  <!-- feet and neck: three separate geometric masses -->
  <g id="frame">
    <rect x="342" y="786" width="158" height="94" rx="34" fill="#4FC9A8"/>
    <rect x="524" y="786" width="158" height="94" rx="34" fill="#4FC9A8"/>
    <rect x="478" y="548" width="68" height="82" rx="28" fill="#4FC9A8"/>
  </g>
  <!-- head and body -->
  <g id="head">
    <rect x="298" y="162" width="428" height="410" rx="126" fill="#7FE7C4"/>
    <path d="M352 292 C376 240 422 208 480 196" fill="none" stroke="#C9FCEB" stroke-width="15" stroke-linecap="round" opacity=".65"/>
  </g>
  <!-- the face is intentionally simple: two eyes and one smile -->
  <g id="face">
    <rect x="394" y="338" width="52" height="72" rx="26" fill="#0F2A25"/>
    <rect x="578" y="338" width="52" height="72" rx="26" fill="#0F2A25"/>
    <rect x="406" y="352" width="14" height="20" rx="7" fill="#D5FFF2" opacity=".9"/>
    <rect x="590" y="352" width="14" height="20" rx="7" fill="#D5FFF2" opacity=".9"/>
    <path d="M480 456 Q512 480 544 456" fill="none" stroke="#0F2A25" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g id="body">
    <rect x="328" y="594" width="368" height="250" rx="98" fill="#7FE7C4"/>
  </g>
  <!-- warm core = compute that stays on the phone -->
  <g id="core">
    <rect x="402" y="642" width="220" height="146" rx="58" fill="#12332C"/>
    <circle cx="512" cy="715" r="42" fill="#4FC9A8"/>
    <circle cx="512" cy="715" r="30" fill="#FFC48A"/>
    <circle cx="503" cy="704" r="10" fill="#FFF0DD" opacity=".9"/>
  </g>
  <!-- Usage: home = wave; empty = both hands open with a soft antenna blink; loading = chest core ring rotates, eyes narrow. -->
</svg>
