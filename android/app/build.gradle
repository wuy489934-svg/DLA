// 原生壳的构建配置：在原有 AGP 之外加入 Kotlin 与 Compose。
// 说明：Java 代码与 Kotlin 代码共用 src/main/java 目录，包名不变。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 网页产物由 web/ 构建；CI 里先 pnpm build，再执行 assembleRelease
def webDist = file('../../web/dist')

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from webDist
    into layout.projectDirectory.dir('src/main/assets/public')
    onlyIf { webDist.isDirectory() }
}

// release 签名：keystore.properties 存在时才启用；不要把密钥提交到仓库
def keystorePropsFile = rootProject.file('../keystore/keystore.properties')
def hasReleaseKey = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.example.chatdemo'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.dla.agent'
        minSdk 29
        targetSdk 36
        versionCode 37
        versionName '2.1'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // 首屏资源免 inflate，直接 mmap；APK 会变大，这是预期
    androidResources {
        noCompress += ['js', 'css', 'html', 'svg', 'woff', 'woff2', 'ttf', 'json']
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Shizuku：免 root 的 shell 后端
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 原生 UI（混合方案 B）：Compose 外壳
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
}

tasks.named('preBuild').configure {
    dependsOn syncWebAssets
}
