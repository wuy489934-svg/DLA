plugins {
    id 'com.android.application'
}

// 网页产物由 web/ 构建；CI 里先 pnpm build，再执行 assembleRelease
def webDist = file('../../web/dist')

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from webDist
    into layout.projectDirectory.dir('src/main/assets/public')
    onlyIf { webDist.isDirectory() }
}

// release 签名：keystore.properties 存在时才启用；不要把密钥提交到仓库
def keystorePropsFile = rootProject.file('../keystore/keystore.properties')
def hasReleaseKey = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.example.chatdemo'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.dla.agent'
        minSdk 29
        targetSdk 36
        versionCode 23
        versionName '1.4.1'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // 首屏资源免 inflate，直接 mmap；APK 会变大，这是预期
    androidResources {
        noCompress += ['js', 'css', 'html', 'svg', 'woff', 'woff2', 'ttf', 'json']
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Shizuku：免 root 的 shell 后端
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

tasks.named('preBuild').configure {
    dependsOn syncWebAssets
}


















